spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${MONGODB_URI}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000

    password-reset:
      reset-token-expiration: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: INFO
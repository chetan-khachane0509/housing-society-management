server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # Society Service
        - id: society-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/society/**

jwt:
  secret-key: ${JWT_SECRET}
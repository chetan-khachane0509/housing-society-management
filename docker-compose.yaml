services:

  auth-service:
    build:
      context: .
      dockerfile: ops/docker/auth-service/Dockerfile
    container_name: hsms-auth-service
    ports:
      - "8081:8081"
    environment:
      MONGODB_URI: ${AUTH_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks:
      - hsms-network

  society-service:
    build:
      context: .
      dockerfile: ops/docker/society-service/Dockerfile
    container_name: hsms-society-service
    ports:
      - "8082:8082"
    environment:
      MONGODB_URI: ${SOCIETY_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - hsms-network

  api-gateway:
    build:
      context: .
      dockerfile: ops/docker/api-gateway/Dockerfile
    container_name: hsms-api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - auth-service
      - society-service
    networks:
      - hsms-network

networks:
  hsms-network:
    driver: bridge
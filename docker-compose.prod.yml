services:

  auth-service:
    image: chery05/hsm-auth-service:1.0.0
    container_name: hsms-auth-service
    ports:
      - "8081:8081"
    environment:
      AUTH_MONGODB_URI: ${AUTH_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    networks:
      - hsms-network

  society-service:
    image: chery05/hsms-society-service:1.0.1
    container_name: hsms-society-service
    ports:
      - "8082:8082"
    environment:
      SOCIETY_MONGODB_URI: ${SOCIETY_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - hsms-network

  api-gateway:
    image: chery05/hsms-api-gateway:1.0.0
    container_name: hsms-api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - auth-service
      - society-service
    networks:
      - hsms-network

networks:
  hsms-network:
    driver: bridge
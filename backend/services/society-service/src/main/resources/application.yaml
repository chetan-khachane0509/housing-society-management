spring:
  application:
    name: society-service

  data:
    mongodb:
      uri: ${SOCIETY_MONGODB_URI}

  cloud:
    discovery:
      enabled: true

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret-key: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: INFO
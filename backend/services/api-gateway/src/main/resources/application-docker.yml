server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: society-service
              uri: http://society-service:8082
              predicates:
                - Path=/api/v1/society/**

jwt:
  secret-key: ${JWT_SECRET}